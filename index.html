<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%230b021a%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%23ffffff%22 font-family=%22sans-serif%22>N</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои ссылки</title>
    <style>
    /* Сброс базовых отступов */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* Живой анимированный темный градиент на фоне */
    body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        
        /* Насыщенная палитра: глубокий фиолетовый, индиго, сапфир, темный циан */
        background: linear-gradient(-45deg, #0b021a, #2b0938, #0f3854, #120e38, #184b74);
        background-size: 300% 300%;
        animation: gradientShift 10s ease infinite;
    }

    /* Анимация плавного перелива градиента */
    @keyframes gradientShift {
        0% {
            background-position: 0% 50%;
        }
        50% {
            background-position: 100% 50%;
        }
        100% {
            background-position: 0% 50%;
        }
    }

    /* Контейнер для кнопок */
    .links-container {
        width: 100%;
        max-width: 420px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px; /* Расстояние между кнопками */
    }

    /* Заголовок страницы */
    .profile-title {
        text-align: center;
        margin-bottom: 15px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    /* Стили для кнопок-ссылок */
    .link-btn {
        display: block;
        text-align: center;
        text-decoration: none;
        color: #ffffff;
        background: rgba(255, 255, 255, 0.07); /* Полупрозрачный фон */
        border: 1px solid rgba(255, 255, 255, 0.15); /* Тонкая стеклянная грань */
        padding: 18px 24px;
        border-radius: 14px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.3px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px); /* Поддержка для Safari/iOS */
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); /* Плавное пружинящее движение */
    }

    /* Эффект при наведении курсора на кнопку */
    .link-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.35);
        transform: translateY(-4px) scale(1.02); /* Кнопка красиво приподнимается и чуть увеличивается */
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35), 0 0 15px rgba(255, 255, 255, 0.1);
    }

    /* Эффект при клике / тапе на телефоне */
    .link-btn:active {
        transform: translateY(-1px) scale(0.99);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    }
</style>
</head>
<body>

    <div class="links-container">
        <!-- Заголовок (можно удалить, если не нужен) -->
        <div class="profile-title">кто это сделал?</div>

        <!-- Список кнопок -->
        <a href="https://nsuem-rasp.vercel.app/" class="link-btn" target="_blank">Расписание</a>
        <a href="https://formatter-one.vercel.app/" class="link-btn" target="_blank">Форматнуть .docx файл</a>
        <!--<a href="https://example.com" class="link-btn" target="_blank">Ссылка 3</a> -->

    <footer style="margin-top: 40px; text-align: center; font-size: 13px; color: rgba(255, 255, 255, 0.4); letter-spacing: 0.5px;">
    made with 💜 by <span style="color: rgba(255, 255, 255, 0.7); font-weight: 600;">me</span>
</footer>
    </div>

</body>
</html>
